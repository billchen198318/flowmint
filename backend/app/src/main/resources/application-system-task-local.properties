# Opt-in local System Task acceptance profile (flowmint schema must be deployed).
# Run from backend/app with -Dspring-boot.run.profiles=system-task-local.
db1.datasource.transactionIsolation=TRANSACTION_READ_COMMITTED

flowmint.groovy.draft-enabled=true
flowmint.groovy.preview.enabled=true
flowmint.groovy.publish.enabled=true
flowmint.groovy.runtime.enabled=true

flowmint.groovy.preview.engine-id=jvm:groovy-5.0.6-trusted1
flowmint.groovy.runtime.engine-id=${flowmint.groovy.preview.engine-id}
flowmint.groovy.recovery.enabled=true
flowmint.groovy.recovery.ready-enabled=true
flowmint.groovy.recovery.execution-deletion-enabled=true
flowmint.groovy.recovery.tenant-ids=A01
flowmint.groovy.incident-handling.enabled=true
flowmint.groovy.manual-retry.enabled=true
flowmint.groovy.recalculate.enabled=true

flowable.async-executor-activate=true
flowable.database-schema-update=false
